systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7877
systemProp.https.nonProxyHosts=dl.google.com|*.google.com|maven.google.com|localhost|127.0.0.1
systemProp.http.nonProxyHosts=dl.google.com|*.google.com|maven.google.com|localhost|127.0.0.1
