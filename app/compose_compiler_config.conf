// ============================================================================
// [2026-11-19 P5] 补登记高频 UI 参数类型
//
// ## 为什么加
// 这四个类此前未被登记，Compose 编译器把含 `List<T>` / `Map<K,V>` / sealed 父类
// 的 data class 一律判为 **unstable**，后果是：任何以它们为参数的 Composable
// **完全无法跳过重组**。
//
// 实测规模：
//   - `settings: Settings` 作为参数出现 **107 处**
//   - `assistant: Assistant` 作为参数出现 **105 处**
//   - `Settings` 有 111 个顶层字段
// 也就是「改一个设置项 → 整棵 UI 树重组」。
//
// ## 为什么现在可以安全登记（逐条验证过，不是拍脑袋）
//
// 判定标准：这些类必须是**不可变值语义**（全部 `val` + 只用 `copy()` 更新）。
// 只要有一处原地改 `var`，登记为 stable 就会导致「跳过重组但 UI 没更新」，
// 那比卡顿严重得多。已逐个 grep 验证：
//
// - `Assistant`：成员字段**全为 val**（文件里那 11 个 `var` 全是函数内局部变量）。
//   全项目无 `assistant.xxx = ` 形式原地赋值，更新一律走 `copy()`。
// - `Settings`：**零成员 var**。全项目更新走 `Settings.copy()`。
// - `DisplaySetting`（Settings 的最大嵌套类型）：零成员 var，纯 data class。
// - `ProviderSetting`：构造参数里有 13 个 `var`，但全项目**无任何原地赋值**
//   （`grep -E "provider[A-Za-z]*\.[a-zA-Z]+ = "` 零命中），一律 `copyProvider()/copy()`。
//   形参 var 只是 Kotlin 语法，不构成可变状态。
// - `Avatar`：sealed class + 两个不可变 data subclass。
//
// ## 风险控制
// 如果将来有人在上述类里加了「原地修改」的字段，这份登记就会变成隐患。
// 守卫测试 `ComposeStabilityConfigGuardTest` 会断言：
//   1. 这些类仍然是全部 val（无成员 var）
//   2. 全项目仍然没有对它们的原地赋值
// 破坏任一条 → 测试失败 → 必须重新评估能否登记。
// ============================================================================
me.rerere.rikkahub.data.datastore.Settings
me.rerere.rikkahub.data.datastore.DisplaySetting
me.rerere.rikkahub.data.model.Assistant
me.rerere.ai.provider.ProviderSetting
me.rerere.rikkahub.data.model.Avatar
